name: Build Social Plus APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://socialps.vercel.app
      KS_PASS: socialplus-keystore
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create shell project
        run: |
          mkdir shell && cd shell
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir www && echo '<!doctype html><title>Social Plus</title><body style="background:#000;color:#fff;font-family:sans-serif;text-align:center;padding-top:40vh">Loading Social Plus…</body>' > www/index.html
          cat > capacitor.config.json <<EOF
          {"appId":"com.krisanalysis.socialplus","appName":"Social Plus","webDir":"www",
           "server":{"url":"$APP_URL","cleartext":false},
           "android":{"appendUserAgent":"SocialPlusApp/1.0"}}
          EOF
          npx cap add android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Apply app icon
        run: |
          cd shell
          npm i @capacitor/assets
          mkdir -p assets
          cp ../icon-1024.png assets/icon-only.png
          node -e "const s=require('sharp');(async()=>{const logo=await s('../icon-1024.png').resize(680,680).toBuffer();await s({create:{width:1024,height:1024,channels:4,background:{r:0,g:0,b:0,alpha:0}}}).composite([{input:logo,gravity:'center'}]).png().toFile('assets/icon-foreground.png');await s({create:{width:1024,height:1024,channels:3,background:{r:0,g:0,b:0}}}).png().toFile('assets/icon-background.png')})()"
          npx capacitor-assets generate --android
      - name: Signing key
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ks.jks
            echo "Using your saved signing key"
          else
            keytool -genkeypair -keystore ks.jks -alias socialplus -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Social Plus, O=Kris Analysis LTD, C=NG"
            mkdir keyout && base64 -w0 ks.jks > keyout/KEYSTORE_B64.txt
            echo "NEW KEY CREATED. Download the KEEP-PRIVATE-signing-key artifact and save its text as the KEYSTORE_B64 secret." >> $GITHUB_STEP_SUMMARY
          fi
      - uses: actions/upload-artifact@v4
        if: hashFiles('keyout/KEYSTORE_B64.txt') != ''
        with:
          name: KEEP-PRIVATE-signing-key
          path: keyout/KEYSTORE_B64.txt
          retention-days: 1
      - name: Build and sign APK
        run: |
          cd shell/android
          chmod +x gradlew
          ./gradlew assembleRelease
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks ../../ks.jks --ks-key-alias socialplus --ks-pass pass:$KS_PASS --key-pass pass:$KS_PASS --out ../../SocialPlus.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SocialPlus-APK
          path: SocialPlus.apk
      - name: Publish direct download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Social Plus app ${{ github.run_number }}
          files: SocialPlus.apk
          fail_on_unmatched_files: true
          make_latest: true
